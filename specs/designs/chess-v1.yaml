name: Chess v1
description: One end-grain chess-pattern board, walnut and brown maple 2.25 in cells,
  cherry border 1.125 in all sides, finished 20.25 in square, 0.5 in thick.
  Each row is built as two half-width panels split at the centre line
  (left half mirrors right half), so no panel is wider than 10.125 in
  and every panel fits the 12.5 in planer.
