# Packed cut-specs for Plaid v1, derived from project.yaml panelSpecs (stick model:
# one full-length stick per component position per panel, glued then sliced).
# Boards ripped full-length into component-width strips; each strip crosscut into
# panel-length sticks. Per-strip width budget reserves saw kerf + planing loss.
