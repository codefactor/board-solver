# yaml-language-server: $schema=../../../schema.json
name: Plaid v1
description: Two end-grain plaid cutting boards built from cherry, walnut, and brown maple.
batch: 2
finishedThickness: [1, 4]
sliceDepth: [1, 8]

sliceGrid:
  - - sliceId: SL
    - sliceId: SR
      flip: H
  - - sliceId: ML
    - sliceId: MR
      flip: H
  - - sliceId: ML
    - sliceId: MR
      flip: H
  - - sliceId: SL
    - sliceId: SR
      flip: H
  - - sliceId: H-L
    - sliceId: H-R
      flip: H
  - - sliceId: SL
    - sliceId: SR
      flip: H
  - - sliceId: ML
    - sliceId: MR
      flip: H
  - - sliceId: ML
    - sliceId: MR
      flip: H
  - - sliceId: SL
    - sliceId: SR
      flip: H
  - - sliceId: H-L
    - sliceId: H-R
      flip: H
  - - sliceId: SL
    - sliceId: SR
      flip: H
  - - sliceId: ML
    - sliceId: MR
      flip: H
  - - sliceId: ML
    - sliceId: MR
      flip: H
  - - sliceId: SL
    - sliceId: SR
      flip: H
  - - sliceId: H-L
    - sliceId: H-R
      flip: H
  - - sliceId: SL
    - sliceId: SR
      flip: H
  - - sliceId: ML
    - sliceId: MR
      flip: H
  - - sliceId: ML
    - sliceId: MR
      flip: H
  - - sliceId: SL
    - sliceId: SR
      flip: H
  - - sliceId: H-L
    - sliceId: H-R
      flip: H
  - - sliceId: SL
    - sliceId: SR
      flip: H
  - - sliceId: ML
    - sliceId: MR
      flip: H
  - - sliceId: ML
    - sliceId: MR
      flip: H
  - - sliceId: SL
    - sliceId: SR
      flip: H


components:
  - id: C1
    species: Cherry
    width: [1, 8]
    thickness: [0, 12]
  - id: C2
    species: Cherry
    width: [0, 12]
    thickness: [0, 12]
  - id: M1
    species: Brown Maple
    width: [1, 8]
    thickness: [0, 12]
  - id: Me
    species: Brown Maple
    width: [0, 12]
    thickness: [0, 12]
  - id: Md
    species: Brown Maple
    width: [0, 4]
    thickness: [0, 12]
  - id: W1
    species: Walnut
    width: [3, 0]
    thickness: [0, 12]
  - id: W2
    species: Walnut
    width: [0, 12]
    thickness: [0, 12]

panels:
  - id: SL
    thickness: [0, 12]
    slices: 20
    components:
      - type: Me
      - type: C2
      - type: M1
      - type: C2
      - type: Md
      - type: C2
      - type: M1
      - type: C2
      - type: Md
  - id: SR
    thickness: [0, 12]
    slices: 20
    components:
      - type: Me
      - type: C2
      - type: M1
      - type: C2
      - type: Md
      - type: C2
      - type: M1
      - type: C2
  - id: ML
    thickness: [0, 12]
    slices: 20
    components:
      - type: Me
      - type: W2
      - type: C1
      - type: W2
      - type: Md
      - type: W2
      - type: C1
      - type: W2
      - type: Md
  - id: MR
    thickness: [0, 12]
    slices: 20
    components:
      - type: Me
      - type: W2
      - type: C1
      - type: W2
      - type: Md
      - type: W2
      - type: C1
      - type: W2
  - id: H
    thickness: [0, 13]
    sliceStrips:
      count: 2
      width: [0, 4]
    profiles:
      - id: L
        slices: 4
      - id: R
        slices: 4
    components:
      - type: Me
      - type: W1
      - type: Md
      - type: W1
      - type: Md
        maxProfile: 1

# Chosen panels to build (solver input). profileLengths are per-profile region
# extents (fullest-first); region length = slices x pitch, pitch = sliceDepth
# [1 1/2"] + miterKerf[1/8"] = 1 10/16".
#   SL,SR,ML,MR (single profile): two panels x 11 slices each -> 22 supplied vs
#        20 demand = 1 spare slice per panel; 11 x 26/16 = 17 14/16" per panel.
#   H:   one panel x (5 L + 5 R) crosscut slices, ripped x2 = 10/10 installed vs
#        8/8 demand = 1 spare slice per profile; 5 x 26/16 = 8 2/16" per region.
panelSpecs:
  - panel: SL
    profileLengths: [[17, 14]]
    count: 2
  - panel: SR
    profileLengths: [[17, 14]]
    count: 2
  - panel: ML
    profileLengths: [[17, 14]]
    count: 2
  - panel: MR
    profileLengths: [[17, 14]]
    count: 2
  - panel: H
    profileLengths: [[8, 2], [8, 2]]
    count: 1

boards:
 - id: BC1
   species: Cherry
   length: [48, 2]
   width: [7, 4]
   thickness: [0, 13]
 - id: BC2
   species: Cherry
   length: [48, 1]
   width: [6, 15]
   thickness: [0, 13]
 - id: BW1
   species: Walnut
   length: [54, 5]
   width: [6, 4]
   thickness: [0, 13]
 - id: BW2
   species: Walnut
   length: [54, 5]
   width: [6, 1]
   thickness: [0, 13]
 - id: BM1
   species: Brown Maple
   length: [98, 1]
   width: [8, 7]
   thickness: [0, 13]
 # Untouched spare maple board (kept in inventory, not consumed by the cut list).
 - id: BM2
   species: Brown Maple
   length: [47, 15]
   width: [8, 4]
   thickness: [0, 13]
