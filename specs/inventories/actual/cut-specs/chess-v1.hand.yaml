# Hand tweak 3: cherry from BC1A plus exactly 2 child boards of BC1A.
# BC1A is the trimmed solver blank, 38 7/8 in long (not raised to 48 in):
# it carries CT x3 only, so its margin slab is 4 13/16 in wide and
# 38 7/8 in long. The 2 children are length-matched segments of that slab,
# so no strip carries an offcut tail:
# BC1A1: 16 1/8 in, 2 thinner longer strips (CB 1 1/8 in each, cut 16 1/8 in).
# BC1A2: 12 7/8 in, 1 larger strip (CT 2 1/4 in, cut 12 7/8 in) plus 1 thinner
# shorter strip (CTH 1 1/8 in, cut 12 7/8 in).
# Children in document order take 16 1/8 in + 1/8 in kerf + 12 7/8 in
# = 29 1/8 in of the 38 7/8 in slab, leaving a 9 3/4 in slab tail unused.
